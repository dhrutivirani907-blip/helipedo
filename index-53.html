<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101712">
<title>Premium</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #203a2a 0%, #101712 48%, #080b09 100%);
    color: #f4f7f4; display: flex; align-items: center; justify-content: center; padding: 22px;
  }
  .app { width: 100%; max-width: 430px; }
  .top { text-align: center; margin-bottom: 28px; }
  .top .crown { font-size: 42px; filter: drop-shadow(0 5px 16px #d8ad4544); }
  .top h1 { margin: 8px 0 5px; font-size: 28px; letter-spacing: 2px; font-weight: 800; }
  .top p { margin: 0; color: #9ba99f; font-size: 14px; }
  .card {
    border: 1px solid #354b3b; border-radius: 24px; padding: 25px 22px;
    background: linear-gradient(145deg, #1c2b21, #121a15); box-shadow: 0 20px 55px #0008;
  }
  .label { text-align: center; color: #b8c6bb; font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; }
  .count { text-align: center; margin: 13px 0 4px; font-size: clamp(48px, 14vw, 68px); font-weight: 800; line-height: 1; color: #f0c85b; font-variant-numeric: tabular-nums; }
  .caption { text-align: center; color: #9daaa1; font-size: 14px; margin-bottom: 22px; }
  .progress-wrap { height: 8px; background: #334239; border-radius: 20px; overflow: hidden; margin-bottom: 24px; }
  .progress { height: 100%; width: 100%; background: linear-gradient(90deg, #d6a832, #f6dc7e); border-radius: 20px; }
  button {
    width: 100%; border: 0; border-radius: 15px; padding: 17px 16px; color: #17180f;
    background: linear-gradient(135deg, #f5d66e, #d8a936); font-size: 16px; font-weight: 800;
    letter-spacing: .7px; cursor: pointer; box-shadow: 0 8px 24px #d4a83b2b; -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(.985); }
  .note { text-align: center; color: #819187; font-size: 12px; margin: 16px 4px 0; line-height: 1.5; }
  .status { min-height: 20px; text-align: center; color: #c9d5cb; font-size: 13px; margin-top: 12px; }
  .reset-hint { text-align: center; color: #617066; font-size: 11px; margin-top: 22px; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="crown">👑</div>
    <h1>PREMIUM</h1>
    <p>Watch ads and build your progress</p>
  </header>

  <section class="card" aria-label="Premium progress">
    <div class="label">Your total count</div>
    <div class="count" id="count">0</div>
    <div class="caption">Ads watched · Unlimited count</div>
    <div class="progress-wrap"><div class="progress"></div></div>
    <button id="watchBtn" type="button">▶ &nbsp; WATCH ADS</button>
    <div class="status" id="status" aria-live="polite"></div>
  </section>

  <p class="note">Tap Watch Ads to open the link. When you return to this app, your count increases by 1.</p>
  <p class="reset-hint">Your count is saved on this device.</p>
</main>

<script>
(() => {
  const COUNT_KEY = "premium_watch_count";
  const PENDING_KEY = "premium_ad_pending";
  const countEl = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const watchBtn = document.getElementById("watchBtn");
  const adLink = "https://uplcm.com/4/11914105";

  function getCount() {
    const value = Number.parseInt(localStorage.getItem(COUNT_KEY) || "0", 10);
    return Number.isFinite(value) && value >= 0 ? value : 0;
  }
  function showCount() {
    countEl.textContent = getCount().toLocaleString();
  }
  function recordReturn() {
    if (localStorage.getItem(PENDING_KEY) !== "1") return;
    localStorage.removeItem(PENDING_KEY);
    localStorage.setItem(COUNT_KEY, String(getCount() + 1));
    showCount();
    statusEl.textContent = "Count +1 added!";
  }

  watchBtn.addEventListener("click", () => {
    localStorage.setItem(PENDING_KEY, "1");
    statusEl.textContent = "Ad link opened. Return here to add +1.";
    // Open from the direct button tap so browsers don't block it.
    const opened = window.open(adLink, "_blank");
    if (!opened) {
      // If popups are blocked, navigate this tab to the link.
      window.location.href = adLink;
    }
  });

  // App/browser return detection. The pending marker is consumed once,
  // so multiple focus/visibility events cannot add duplicate counts.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) recordReturn();
  });
  window.addEventListener("focus", recordReturn);
  window.addEventListener("pageshow", recordReturn);

  showCount();
})();
</script>
</body>
</html>
